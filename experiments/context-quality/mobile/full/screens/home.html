<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Pulse</title>
  <link rel="stylesheet" href="../mobile.css">
  <script type="module" src="../api.js"></script>
</head>
<body>
  <div id="app">
    <!-- ────── Market Breadth Header ────── -->
    <header class="full-width" style="padding:24px 16px 12px">
      <h1 style="font-size:1.25rem;font-weight:700;margin-bottom:8px">Pulse</h1>
      <div id="breadth-summary" class="card" style="padding:16px;display:flex;gap:24px;font-size:.875rem">
        <div><span class="muted" style="display:block;font-size:.75rem">7d avg</span><span id="b7">—</span></div>
        <div><span class="muted" style="display:block;font-size:.75rem">30d avg</span><span id="b30">—</span></div>
        <div><span class="muted" style="display:block;font-size:.75rem">change</span><span id="bdelta">—</span></div>
      </div>
    </header>

    <!-- ────── Set Matrix ────── -->
    <section class="full-width" style="padding:0 16px 80px">
      <h2 class="muted" style="font-size:.8125rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Sets</h2>
      <div id="matrix" style="display:flex;flex-direction:column;gap:2px"></div>
    </section>
  </div>

  <!-- ────── Bottom Navigation ────── -->
  <nav class="bottom-nav">
    <a href="#/pulse"   class="active" data-icon="📊">Pulse</a>
    <a href="#/cards"  data-icon="🃏">Cards</a>
    <a href="#/sealed" data-icon="📦">Sealed</a>
    <a href="#/sets"   data-icon="🗂️">Sets</a>
    <a href="#/vs"     data-icon="⚔️">VS</a>
  </nav>

  <script type="module">
    import { marketBreadth, setsMatrix } from '../api.js';

    // ── Breadth ──
    marketBreadth({ days: 7 }).then(d => {
      document.getElementById('b7').textContent = d.avg ?? '—';
    });
    marketBreadth({ days: 30 }).then(d => {
      document.getElementById('b30').textContent = d.avg ?? '—';
      if (d.delta != null) {
        const el = document.getElementById('bdelta');
        el.textContent = (d.delta > 0 ? '+' : '') + d.delta.toFixed(1) + '%';
        el.style.color = d.delta >= 0 ? 'var(--accent)' : 'var(--accent-bright)';
      }
    });

    // ── Set Matrix ──
    setsMatrix().then(rows => {
      const container = document.getElementById('matrix');
      container.innerHTML = '';
      for (const s of rows) {
        const row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML = `<span style="flex:1;font-weight:500">${s.name}</span>
          <span style="color:var(--text-secondary);font-size:.8125rem">$${s.price ?? '—'}</span>
          <span style="color:${(s.change ?? 0) >= 0 ? 'var(--accent)' : 'var(--accent-bright)'};font-weight:600">${(s.change ?? 0) >= 0 ? '+' : ''}${(s.change ?? 0).toFixed(1)}%</span>`;
        container.appendChild(row);
      }
    });
  </script>
</body>
</html>
