<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Register</title>
  <link rel="stylesheet" href="../mobile.css">
</head>
<body>
  <div id="app">
    <main style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px">
      <div class="card" style="max-width:360px;width:100%;padding:32px 24px;display:flex;flex-direction:column;gap:16px;text-align:center">
        <div style="font-size:2rem;font-weight:800;color:var(--accent);line-height:1">Yawn</div>
        <p class="muted" style="font-size:.875rem;margin:0">Create your account</p>

        <form id="register-form" style="display:flex;flex-direction:column;gap:12px">
          <input type="email" placeholder="Email" required
            style="background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:.9375rem;color:var(--text-primary);outline:none;width:100%">
          <input type="password" placeholder="Password" required
            style="background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:.9375rem;color:var(--text-primary);outline:none;width:100%">
          <input type="password" placeholder="Confirm Password" required
            style="background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:.9375rem;color:var(--text-primary);outline:none;width:100%">
          <button type="submit" class="button" style="background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:12px;font-size:.9375rem;font-weight:600;cursor:pointer;width:100%">Create Account</button>
        </form>

        <a href="login.html" style="font-size:.8125rem;color:var(--accent);text-decoration:none">Already have one? Sign in</a>
      </div>
    </main>
  </div>
</body>
</html>
