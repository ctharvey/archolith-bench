<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Set Sealed</title>
  <link rel="stylesheet" href="../mobile.css">
  <script type="module" src="../api.js"></script>
</head>
<body>
  <div id="app">
    <!-- Reusable back-header -->
    <header style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-secondary);position:sticky;top:0;z-index:10">
      <a href="#" onclick="history.back()" style="font-size:1.25rem;line-height:1;text-decoration:none;color:var(--text-primary)">←</a>
      <span id="page-title" style="font-size:1rem;font-weight:600;flex:1">Set Sealed</span>
    </header>

    <!-- Sealed products for this set (reuses sealed EV badge row) -->
    <section style="padding:0 16px 80px">
      <div id="sealed-list" style="display:flex;flex-direction:column;gap:2px"></div>
    </section>
  </div>

  <script type="module">
    import { sealedList } from '../api.js';

    const setId = new URLSearchParams(location.search).get('setId');
    if (setId) {
      sealedList({ setId }).then(items => {
        const c = document.getElementById('sealed-list');
        for (const p of items) {
          const r = document.createElement('div');
          r.className = 'list-row';
          r.innerHTML = `<img src="${p.image ?? ''}" alt="" style="width:36px;height:36px;border-radius:4px;object-fit:cover;flex-shrink:0">
            <span style="flex:1;font-weight:500">${p.name ?? '—'}</span>
            <span style="color:var(--text-secondary);font-size:.8125rem;white-space:nowrap">${p.type ?? ''}</span>
            <span style="color:var(--accent);font-weight:600;font-size:.8125rem">$${p.ev ?? '—'}</span>`;
          c.appendChild(r);
        }
      });
    }
  </script>
</body>
</html>
