<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Transactions</title>
  <link rel="stylesheet" href="../mobile.css">
  <script type="module" src="../api.js"></script>
</head>
<body>
  <div id="app">
    <!-- Portfolio summary -->
    <header class="full-width" style="padding:16px">
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:16px">
        <div><span class="muted" style="font-size:.75rem">Portfolio</span><span id="total-value" style="font-size:1.25rem;font-weight:700">—</span></div>
        <div><span class="muted" style="font-size:.75rem">P/L</span><span id="total-pl" style="font-size:1.125rem;font-weight:700">—</span></div>
        <div><span class="muted" style="font-size:.75rem">Trades</span><span id="total-trades" style="font-size:.9375rem">—</span></div>
      </div>
    </header>

    <!-- Transaction list -->
    <section style="padding:0 16px 80px">
      <div id="tx-list" style="display:flex;flex-direction:column;gap:2px"></div>
    </section>
  </div>

  <nav class="bottom-nav">
    <a href="#/pulse" class="active" data-icon="📊">Pulse</a>
    <a href="#/cards"  data-icon="🃏">Cards</a>
    <a href="#/sealed" data-icon="📦">Sealed</a>
    <a href="#/sets"   data-icon="🗂️">Sets</a>
    <a href="#/vs"     data-icon="⚔️">VS</a>
  </nav>

  <script type="module">
    import { transactions } from '../api.js';

    transactions().then(txs => {
      let total = 0, pl = 0, count = 0;
      const c = document.getElementById('tx-list');
      for (const t of txs) {
        const r = document.createElement('div');
        r.className = 'list-row';
        const plColor = (t.pl ?? 0) >= 0 ? 'var(--accent)' : '#dc2626';
        r.innerHTML = `<span style="flex:1;font-weight:500">${t.card ?? '—'}</span>
          <span style="color:var(--text-secondary);font-size:.8125rem">×${t.qty ?? 1}</span>
          <span style="font-size:.875rem">$${t.price ?? '—'}</span>
          <span style="color:${plColor};font-weight:600;font-size:.8125rem">${(t.pl ?? 0) >= 0 ? '+' : ''}$${(t.pl ?? 0).toFixed(2)}</span>`;
        c.appendChild(r);
        total += t.price ?? 0;
        pl += t.pl ?? 0;
        count++;
      }
      document.getElementById('total-value').textContent  = `$${total.toFixed(2)}`;
      document.getElementById('total-pl').textContent      = (pl >= 0 ? '+' : '') + `$${pl.toFixed(2)}`;
      document.getElementById('total-pl').style.color       = pl >= 0 ? 'var(--accent)' : '#dc2626';
      document.getElementById('total-trades').textContent   = count;
    });
  </script>
</body>
</html>
