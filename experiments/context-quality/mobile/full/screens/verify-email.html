<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Verify Email</title>
  <link rel="stylesheet" href="../mobile.css">
</head>
<body>
  <div id="app">
    <main style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px">
      <div class="card" style="max-width:360px;width:100%;padding:32px 24px;display:flex;flex-direction:column;gap:16px;text-align:center">
        <div style="font-size:2rem;font-weight:800;color:var(--accent);line-height:1">Yawn</div>

        <div style="font-size:2.5rem">&#9993;</div>
        <p style="font-size:.9375rem;margin:0;color:var(--text-primary)">Check your email for a verification link.</p>
        <p class="muted" style="font-size:.8125rem;margin:0">Once confirmed you can continue to your account.</p>

        <a href="login.html" class="button" style="background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:12px;font-size:.9375rem;font-weight:600;cursor:pointer;width:100%;text-decoration:none;text-align:center">Continue to Login</a>
      </div>
    </main>
  </div>
</body>
</html>
