<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Card</title>
  <link rel="stylesheet" href="mobile.css">
  <script type="module" src="api.js"></script>
</head>
<body>
  <main id="app" class="page">
    <header class="page-header">
      <div class="flex items-center gap-2">
        <a href="#" onclick="history.back()" class="button" style="width:auto;min-width:44px;padding:8px;background:none;border:none;color:var(--text-primary)" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:24px;height:24px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <h1 id="card-title" style="font-size:1.25rem;font-weight:600">Loading...</h1>
      </div>
    </header>
    <section class="page-body">
      <div id="card-hero" class="flex flex-col items-center gap-4" style="padding:24px 0">
        <img id="card-image" alt="" style="width:180px;height:252px;object-fit:contain;border-radius:var(--radius);background:var(--bg-mid)">
        <div class="flex-col items-center">
          <span id="card-name" class="font-bold text-lg"></span>
          <span id="card-set" class="text-sm text-muted"></span>
          <span id="card-price" class="font-bold" style="font-size:1.5rem;color:var(--accent-green);margin-top:8px"></span>
        </div>
      </div>
      <div class="card" style="background:var(--bg-surface)">
        <div style="height:120px;display:flex;align-items:center;justify-content:center;background:var(--bg-deep);border-radius:var(--radius);color:var(--muted);font-size:0.875rem" id="price-chart-placeholder">Price history chart (placeholder)</div>
      </div>
      <div class="flex gap-2 mt-2">
        <a class="button" id="buy-tcgplayer" href="#" target="_blank" rel="noopener">Buy on TCGPlayer</a>
        <a class="button button-outline" id="buy-ebay" href="#" target="_blank" rel="noopener">Buy on eBay</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { cardDetail } from "api.js";
    const id = new URLSearchParams(location.search).get("id");
    if (id) {
      cardDetail(id).then(card => {
        document.title = `Yawn — ${card.name}`;
        document.getElementById("card-title").textContent = card.name;
        document.getElementById("card-image").src = card.image ?? "";
        document.getElementById("card-name").textContent = card.name;
        document.getElementById("card-set").textContent = card.set ?? "";
        document.getElementById("card-price").textContent = `$${(card.price ?? 0).toFixed(2)}`;
        document.getElementById("buy-tcgplayer").href = card.tcgplayerUrl ?? "#";
        document.getElementById("buy-ebay").href = card.ebayUrl ?? "#";
      });
    }
  </script>
</body>
</html>
