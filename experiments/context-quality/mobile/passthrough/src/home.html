<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Pulse</title>
  <link rel="stylesheet" href="mobile.css">
  <script type="module" src="api.js"></script>
</head>
<body>
  <main id="app" class="page">
    <header class="page-header">
      <h1>Pulse</h1>
      <div class="flex gap-4 mt-2 text-sm" id="breadth-summary"></div>
    </header>

    <section class="page-body">
      <h2 class="text-sm text-muted mb-2">Sets</h2>
      <div id="set-matrix" class="flex-col"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Main tabs">
    <button class="nav-btn active" data-tab="pulse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h3l2-5 4 10 2-5h5"/></svg>
      Pulse
    </button>
    <button class="nav-btn" data-tab="cards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 2v2M16 2v2"/></svg>
      Cards
    </button>
    <button class="nav-btn" data-tab="sealed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      Sealed
    </button>
    <button class="nav-btn" data-tab="sets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Sets
    </button>
    <button class="nav-btn" data-tab="vs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
      VS
    </button>
  </nav>

  <script type="module">
    import { setsMatrix, marketBreadth } from "api.js";

    (async () => {
      const [breadth, matrix] = await Promise.all([
        marketBreadth(),
        setsMatrix()
      ]);

      // Breadth summary: 7d / 30d count + change
      const summary = document.getElementById("breadth-summary");
      if (breadth) {
        const days7 = breadth["7d"] ?? breadth.sevenDay ?? { count: 0, change: 0 };
        const days30 = breadth["30d"] ?? breadth.thirtyDay ?? { count: 0, change: 0 };
        summary.innerHTML = `
          <span class="text-muted">7d: ${days7.count ?? "--"}</span>
          <span class="${(days7.change ?? 0) >= 0 ? "text-muted" : ""}" style="color:${(days7.change ?? 0) >= 0 ? "var(--accent-green-light)" : "var(--danger)"}">${days7.change >= 0 ? "+" : ""}${days7.change ?? "--"}%</span>
          <span class="text-muted">30d: ${days30.count ?? "--"}</span>
          <span class="" style="color:${(days30.change ?? 0) >= 0 ? "var(--accent-green-light)" : "var(--danger)"}">${days30.change >= 0 ? "+" : ""}${days30.change ?? "--"}%</span>
        `;
      }

      // Set matrix rows
      const container = document.getElementById("set-matrix");
      if (matrix?.sets) {
        container.innerHTML = matrix.sets.map(set => {
          const change = set.priceChange ?? set.change ?? 0;
          const isPos = change >= 0;
          return `
            <div class="list-row">
              <div class="flex-col" style="flex:1">
                <span class="font-bold">${set.name}</span>
                <span class="text-sm text-muted">${set.code ?? ""}</span>
              </div>
              <div class="flex-col items-end">
                <span>$${(set.price ?? 0).toFixed(2)}</span>
                <span class="text-sm" style="color:${isPos ? "var(--accent-green-light)" : "var(--danger)"}">${isPos ? "+" : ""}${change.toFixed(2)}%</span>
              </div>
            </div>
          `;
        }).join("");
      }
    })();
  </script>
</body>
</html>
