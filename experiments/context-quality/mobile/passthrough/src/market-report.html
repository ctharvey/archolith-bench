<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Market Report</title>
  <link rel="stylesheet" href="mobile.css">
  <script type="module" src="api.js"></script>
</head>
<body>
  <main id="app" class="page">
    <header class="page-header"><h1>Market Report</h1></header>
    <section class="page-body">
      <div class="card" id="breadth-overview">
        <h3 class="font-bold mb-2">Breadth Overview</h3>
        <div class="flex gap-4 text-sm" id="breadth-stats"></div>
      </div>
      <h2 class="text-sm text-muted mb-2">Top Gainers</h2>
      <div id="gainers" class="flex-col"></div>
      <h2 class="text-sm text-muted mb-2 mt-2">Top Losers</h2>
      <div id="losers" class="flex-col"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Main tabs">
    <button class="nav-btn active" data-tab="pulse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h3l2-5 4 10 2-5h5"/></svg> Pulse</button>
    <button class="nav-btn" data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 2v2M16 2v2"/></svg> Cards</button>
    <button class="nav-btn" data-tab="sealed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg> Sealed</button>
    <button class="nav-btn" data-tab="sets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Sets</button>
    <button class="nav-btn" data-tab="vs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg> VS</button>
  </nav>

  <script type="module">
    import { marketBreadth, setsMatrix } from "api.js";

    (async () => {
      const [breadth, matrix] = await Promise.all([marketBreadth(), setsMatrix()]);
      const b = breadth ?? {};
      document.getElementById("breadth-stats").innerHTML = [7,30].map(d => `
        <div class="flex-col">
          <span class="text-muted">${d}d</span>
          <span class="font-bold">${(b[`${d}d`] ?? b[`${d}day`] ?? {count:0}).count ?? 0}</span>
          <span style="color:${((b[`${d}d`] ?? {}).change ?? 0) >= 0 ? "var(--accent-green-light)" : "var(--danger)"}">${(b[`${d}d`] ?? {}).change ?? 0}%</span>
        </div>
      `).join("");

      const sets = matrix?.sets ?? [];
      const sorted = [...sets].sort((a,b) => (b.priceChange ?? 0) - (a.priceChange ?? 0));
      const topGainers = sorted.slice(0,5);
      const topLosers = sorted.slice(-5).reverse();
      document.getElementById("gainers").innerHTML = topGainers.map(s => `
        <div class="list-row">
          <span style="flex:1">${s.name}</span>
          <span class="font-bold">${(s.price ?? 0).toFixed(2)}</span>
          <span style="color:var(--accent-green-light)">+${(s.priceChange ?? 0).toFixed(2)}%</span>
        </div>
      `).join("");
      document.getElementById("losers").innerHTML = topLosers.map(s => `
        <div class="list-row">
          <span style="flex:1">${s.name}</span>
          <span class="font-bold">${(s.price ?? 0).toFixed(2)}</span>
          <span style="color:var(--danger)">${(s.priceChange ?? 0).toFixed(2)}%</span>
        </div>
      `).join("");
    })();
  </script>
</body>
</html>
