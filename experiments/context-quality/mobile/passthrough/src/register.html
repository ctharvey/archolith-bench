<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Register</title>
  <link rel="stylesheet" href="mobile.css">
  <script type="module" src="api.js"></script>
</head>
<body>
  <main id="app" class="page" style="padding-bottom:0;justify-content:center">
    <div class="card" style="max-width:360px;margin:0 auto;padding:32px 24px">
      <div class="flex-col items-center gap-2 mb-4">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2" style="width:48px;height:48px"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        <span class="font-bold" style="font-size:1.25rem">Yawn</span>
      </div>
      <label class="text-sm text-muted mb-1">Email</label>
      <input type="email" id="email" class="button" placeholder="you@example.com" style="background:var(--bg-deep);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:1rem;width:100%;margin-bottom:12px">
      <label class="text-sm text-muted mb-1">Password</label>
      <input type="password" id="password" class="button" placeholder="••••••••" style="background:var(--bg-deep);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:1rem;width:100%;margin-bottom:12px">
      <label class="text-sm text-muted mb-1">Confirm</label>
      <input type="password" id="confirm" class="button" placeholder="••••••••" style="background:var(--bg-deep);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:1rem;width:100%;margin-bottom:20px">
      <button id="register-btn" class="button" style="border-radius:8px">Create Account</button>
      <div class="flex justify-center mt-2">
        <a href="/login" class="text-sm">Already have one? <span style="color:var(--accent-green-light)">Sign in</span></a>
      </div>
    </div>
  </main>
</body>
</html>
