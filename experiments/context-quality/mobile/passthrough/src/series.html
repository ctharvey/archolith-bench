<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Series</title>
  <link rel="stylesheet" href="mobile.css">
  <script type="module" src="api.js"></script>
</head>
<body>
  <main id="app" class="page">
    <header class="page-header">
      <div class="flex items-center gap-2">
        <a href="#" onclick="history.back()" class="button" style="width:auto;min-width:44px;padding:8px;background:none;border:none;color:var(--text-primary)" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:24px;height:24px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <h1 id="series-title" style="font-size:1.25rem;font-weight:600">Loading...</h1>
      </div>
    </header>
    <section class="page-body" id="series-sets"></section>
  </main>

  <script type="module">
    import { series } from "api.js";
    const id = new URLSearchParams(location.search).get("id");
    if (id) {
      series({ id }).then(data => {
        const s = data.series ?? data;
        document.title = `Yawn — ${s.name}`;
        document.getElementById("series-title").textContent = s.name;
        const sets = s.sets ?? [];
        document.getElementById("series-sets").innerHTML = sets.map(set => `
          <div class="list-row" data-id="${set.id}">
            <img src="${set.logo ?? set.image ?? ""}" alt="${set.name}" loading="lazy" style="width:44px;height:44px;object-fit:contain;background:var(--bg-mid);border-radius:4px">
            <div class="flex-col" style="flex:1">
              <span class="font-bold">${set.name}</span>
              <span class="text-sm text-muted">${set.code ?? ""}</span>
            </div>
            <span class="text-sm text-muted">${set.cardCount ?? ""} cards</span>
            <span class="text-sm">${set.releaseYear ?? ""}</span>
          </div>
        `).join("");
      });
    }
  </script>
</body>
</html>
