<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Set Detail</title>
  <link rel="stylesheet" href="mobile.css">
  <script type="module" src="api.js"></script>
</head>
<body>
  <main id="app" class="page">
    <header class="page-header">
      <div class="flex items-center gap-2">
        <a href="#" onclick="history.back()" class="button" style="width:auto;min-width:44px;padding:8px;background:none;border:none;color:var(--text-primary)" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:24px;height:24px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <h1 id="set-title" style="font-size:1.25rem;font-weight:600">Loading...</h1>
      </div>
      <div id="set-meta" class="flex gap-4 text-sm text-muted mt-2"></div>
    </header>
    <section class="page-body" id="set-cards-list"></section>
  </main>

  <script type="module">
    import { setDetail } from "api.js";
    const id = new URLSearchParams(location.search).get("id");
    if (id) {
      setDetail(id).then(set => {
        document.title = `Yawn — ${set.name}`;
        document.getElementById("set-title").textContent = set.name;
        document.getElementById("set-meta").innerHTML = `
          <span>${set.releaseYear ?? ""}</span>
          <span>${set.cardCount ?? ""} cards</span>
        `;
        const cards = set.cards ?? [];
        document.getElementById("set-cards-list").innerHTML = cards.map(c => `
          <div class="list-row" data-id="${c.id}">
            <img src="${c.image ?? c.thumbnail ?? ""}" alt="${c.name}" loading="lazy" style="width:44px;height:64px;object-fit:cover;border-radius:4px;background:var(--bg-mid)">
            <div class="flex-col" style="flex:1">
              <span class="font-bold">${c.name}</span>
              <span class="text-sm text-muted">#${c.number ?? ""}</span>
            </div>
            <span class="font-bold">$${(c.price ?? 0).toFixed(2)}</span>
          </div>
        `).join("");
      });
    }
  </script>
</body>
</html>
