<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Set Sealed</title>
  <link rel="stylesheet" href="mobile.css">
  <script type="module" src="api.js"></script>
</head>
<body>
  <main id="app" class="page">
    <header class="page-header">
      <div class="flex items-center gap-2">
        <a href="#" onclick="history.back()" class="button" style="width:auto;min-width:44px;padding:8px;background:none;border:none;color:var(--text-primary)" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:24px;height:24px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <h1 id="page-title" style="font-size:1.25rem;font-weight:600">Loading...</h1>
      </div>
    </header>
    <section class="page-body" id="sealed-products"></section>
  </main>

  <script type="module">
    import { sealedList } from "api.js";
    const setId = new URLSearchParams(location.search).get("setId");
    if (setId) {
      sealedList({ setId }).then(data => {
        const items = data.sealed ?? data ?? [];
        document.getElementById("page-title").textContent = items[0]?.set ?? "Sealed";
        document.getElementById("sealed-products").innerHTML = items.map(s => `
          <div class="list-row">
            <img src="${s.image ?? ""}" alt="${s.name}" loading="lazy" style="width:44px;height:64px;object-fit:cover;border-radius:4px;background:var(--bg-mid)">
            <div class="flex-col" style="flex:1">
              <span class="font-bold">${s.name}</span>
              <span class="text-sm text-muted">${s.set ?? ""}</span>
            </div>
            <span style="color:var(--accent-green)">EV ${(s.ev ?? 0).toFixed(1)}%</span>
            <span class="font-bold">$${(s.price ?? 0).toFixed(2)}</span>
          </div>
        `).join("");
      });
    }
  </script>
</body>
</html>
