<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Yawn — Transactions</title>
  <link rel="stylesheet" href="mobile.css">
  <script type="module" src="api.js"></script>
</head>
<body>
  <main id="app" class="page">
    <header class="page-header"><h1>Transactions</h1></header>
    <section class="page-body">
      <div class="card" id="portfolio-total">
        <div class="flex items-center justify-between">
          <span class="text-muted">Portfolio</span>
          <span id="total-val" class="font-bold"></span>
        </div>
        <div class="flex items-center justify-between mt-2">
          <span class="text-muted">P/L</span>
          <span id="pnl" class="font-bold"></span>
        </div>
      </div>
      <div id="tx-list" class="flex-col"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Main tabs">
    <button class="nav-btn active" data-tab="pulse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h3l2-5 4 10 2-5h5"/></svg> Pulse</button>
    <button class="nav-btn" data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 2v2M16 2v2"/></svg> Cards</button>
    <button class="nav-btn" data-tab="sealed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg> Sealed</button>
    <button class="nav-btn" data-tab="sets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Sets</button>
    <button class="nav-btn" data-tab="vs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg> VS</button>
  </nav>

  <script type="module">
    import { transactions } from "api.js";

    (async () => {
      const data = await transactions();
      const txns = data.transactions ?? data ?? [];
      const total = txns.reduce((s, t) => s + (t.price ?? 0) * (t.qty ?? 1), 0);
      const cost = txns.reduce((s, t) => s + (t.cost ?? t.price ?? 0) * (t.qty ?? 1), 0);
      const pl = total - cost;

      document.getElementById("total-val").textContent = `$${total.toFixed(2)}`;
      const pnlEl = document.getElementById("pnl");
      pnlEl.textContent = `${pl >= 0 ? "+" : ""}$${pl.toFixed(2)}`;
      pnlEl.style.color = pl >= 0 ? "var(--accent-green-light)" : "var(--danger)";

      document.getElementById("tx-list").innerHTML = txns.map(t => {
        const plRow = (t.price ?? 0) - (t.cost ?? 0);
        return `
          <div class="list-row">
            <span class="text-sm text-muted" style="min-width:68px">${t.date ?? ""}</span>
            <div class="flex-col" style="flex:1">
              <span class="font-bold">${t.card ?? t.name ?? ""}</span>
              <span class="text-sm text-muted">${t.qty ?? 1}x</span>
            </div>
            <span class="font-bold">$${(t.price ?? 0).toFixed(2)}</span>
            <span class="text-sm" style="color:${plRow >= 0 ? "var(--accent-green-light)" : "var(--danger)"}">${plRow >= 0 ? "+" : ""}$${plRow.toFixed(2)}</span>
          </div>
        `;
      }).join("");
    })();
  </script>
</body>
</html>
