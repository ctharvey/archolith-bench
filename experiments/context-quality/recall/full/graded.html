<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-scale=1, user-scalable=no">
  <title>Graded — Yawn</title>
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div class="search-sticky">
    <input type="search" class="search-input" id="graded-search" placeholder="Search graded cards…" autocomplete="off">
  </div>

  <main class="container" id="results">
    <div class="graded-row" data-graded-id="">
      <img class="graded-thumb" src="" alt="" loading="lazy" width="44" height="44">
      <div class="graded-row-body">
        <div class="graded-row-name"></div>
        <div class="graded-row-grade"></div>
      </div>
      <div class="graded-row-price"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item active" data-tab="cards">Cards</a>
    <a class="nav-item" data-tab="sealed">Sealed</a>
    <a class="nav-item" data-tab="sets">Sets</a>
    <a class="nav-item" data-tab="vs">VS</a>
  </nav>

  <script type="module">
    import { graded } from './api.js';
    const input = document.getElementById('graded-search');
    const results = document.getElementById('results');
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(async () => {
        const q = input.value.trim();
        if (!q) return;
        try {
          const data = await graded(q);
          renderResults(data);
        } catch (e) {
          results.innerHTML = `<p class="text-muted">${e.message}</p>`;
        }
      }, 300);
    });
    function renderResults(cards) {
      results.innerHTML = '';
      for (const c of cards) {
        const row = document.createElement('div');
        row.className = 'graded-row';
        row.innerHTML = `
          <img class="graded-thumb" src="${c.image || ''}" alt="${c.name}" loading="lazy" width="44" height="44">
          <div class="graded-row-body">
            <div class="graded-row-name">${c.name}</div>
            <div class="graded-row-grade">${c.grade || ''}</div>
          </div>
          <div class="graded-row-price">${c.price != null ? '$' + c.price.toFixed(2) : '—'}</div>
        `;
        results.appendChild(row);
      }
    }
  </script>
</body>
</html>
