<!-- cards.html — Cards browse/search -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cards · Yawn</title><link rel="stylesheet" href="mobile.css"></head>
<body>
<div class="search-sticky"><input class="search-input" type="search" placeholder="Search cards…"></div>
<div id="card-list">
  <!-- canonical card row pattern: .list-row > .row-thumb + .row-body(.row-name/.row-sub) + .row-meta -->
  <a class="list-row" href="card-detail.html">
    <div class="row-thumb"></div>
    <div class="row-body"><div class="row-name">Charizard</div><div class="row-sub">Base Set · #4</div></div>
    <div class="row-meta">$420</div>
  </a>
</div>
<nav class="bottom-nav">
  <a href="home.html">Pulse</a><a class="active" href="cards.html">Cards</a>
  <a href="sealed.html">Sealed</a><a href="sets.html">Sets</a><a href="vs.html">VS</a>
</nav>
<script type="module">
import { cardSearch } from './api.js';
const list = document.getElementById('card-list');
async function load(q){ const cards = await cardSearch({ q }); list.innerHTML = cards.map(c =>
  `<a class="list-row" href="card-detail.html?id=${c.id}"><div class="row-thumb"></div>`+
  `<div class="row-body"><div class="row-name">${c.name}</div><div class="row-sub">${c.set}</div></div>`+
  `<div class="row-meta">$${c.price}</div></a>`).join(''); }
document.querySelector('.search-input').addEventListener('input', e => load(e.target.value));
</script>
</body></html>
