<!-- sealed.html — Sealed products browse -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sealed · Yawn</title><link rel="stylesheet" href="mobile.css"></head>
<body>
<div class="search-sticky"><input class="search-input" type="search" placeholder="Search sealed…"></div>
<div id="sealed-list">
  <a class="list-row" href="sealed-detail.html">
    <div class="row-thumb"></div>
    <div class="row-body"><div class="row-name">Booster Box</div><div class="row-sub">Scarlet & Violet</div></div>
    <div class="row-meta">$143.72</div>
  </a>
</div>
<nav class="bottom-nav">
  <a href="home.html">Pulse</a><a href="cards.html">Cards</a>
  <a class="active" href="sealed.html">Sealed</a><a href="sets.html">Sets</a><a href="vs.html">VS</a>
</nav>
<script type="module">
import { sealedList } from './api.js';
const list = document.getElementById('sealed-list');
async function load(q){ const items = await sealedList({ q }); list.innerHTML = items.map(s =>
  `<a class="list-row" href="sealed-detail.html?id=${s.id}"><div class="row-thumb"></div>`+
  `<div class="row-body"><div class="row-name">${s.name}</div><div class="row-sub">${s.release}</div></div>`+
  `<div class="row-meta">$${s.ev}</div></a>`).join(''); }
document.querySelector('.search-input').addEventListener('input', e => load(e.target.value));
</script>
</body></html>
