<script type="module">
import { series } from './api.js';
const list = document.getElementById('series-list');
series().then(items => { list.innerHTML = items.map(s =>
  `<a class="list-row" href="sets.html?series=${s.id}"><div class="row-thumb"></div>`+
  `<div class="row-body"><div class="row-name">${s.name}</div></div>`+
  `<div class="row-meta">${s.setCount} sets</div></a>`).join(''); });
</script>
