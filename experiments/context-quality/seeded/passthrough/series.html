<!-- series.html — Series browse -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Series · Yawn</title><link rel="stylesheet" href="mobile.css"></head>
<body>
<div class="search-sticky"><input class="search-input" type="search" placeholder="Search series…"></div>
<div id="series-list">
  <a class="list-row" href="sets.html">
    <div class="row-thumb"></div>
    <div class="row-body"><div class="row-name">Base</div><div class="row-sub">Original series</div></div>
    <div class="row-meta">4 sets</div>
  </a>
</div>
<nav class="bottom-nav">
  <a href="home.html">Pulse</a><a href="cards.html">Cards</a>
  <a href="market.html">Market</a><a href="sealed.html">Sealed</a><a href="graded.html">Graded</a><a class="active" href="series.html">Series</a><a href="vs.html">VS</a>
</nav>
<script type="module">
import { series } from './api.js';
const list = document.getElementById('series-list');
async function load(q){ const data = await series({ q }); list.innerHTML = data.map(s =>
  `<a class="list-row" href="sets.html?series=${s.id}"><div class="row-thumb"></div>`+
  `<div class="row-body"><div class="row-name">${s.name}</div><div class="row-sub">${s.description ?? ''}</div></div>`+
  `<div class="row-meta">${s.setCount} sets</div></a>`).join(''); }
document.querySelector('.search-input').addEventListener('input', e => load(e.target.value));
</script>
</body></html>
