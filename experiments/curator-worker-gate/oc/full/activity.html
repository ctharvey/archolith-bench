<!-- activity.html — Recent activity feed -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity · Yawn</title><link rel="stylesheet" href="mobile.css"></head>
<body>
<div class="search-sticky"><input class="search-input" type="search" placeholder="Filter activity…"></div>
<div id="activity-list">
  <a class="list-row" href="card-detail.html">
    <div class="row-thumb"></div>
    <div class="row-body"><div class="row-name">Added Charizard</div><div class="row-sub">Base Set · #4</div></div>
    <div class="row-meta">2m ago</div>
  </a>
</div>
<nav class="bottom-nav">
  <a href="home.html">Pulse</a><a href="cards.html">Cards</a>
  <a href="sealed.html">Sealed</a><a href="sets.html">Sets</a><a href="decks.html">Decks</a><a href="series.html">Series</a><a href="stats.html">Stats</a><a class="active" href="activity.html">Activity</a><a href="wishlist.html">Wish</a><a href="portfolio.html">Portfolio</a><a href="trades.html">Trades</a><a href="vs.html">VS</a>
</nav>
<script type="module">
import { activity } from './api.js';
const list = document.getElementById('activity-list');
async function load(q){ const items = await activity({ q }); list.innerHTML = items.map(a =>
  `<a class="list-row" href="card-detail.html?id=${a.id}"><div class="row-thumb"></div>`+
  `<div class="row-body"><div class="row-name">${a.action} ${a.card}</div><div class="row-sub">${a.set}</div></div>`+
  `<div class="row-meta">${a.time}</div></a>`).join(''); }
document.querySelector('.search-input').addEventListener('input', e => load(e.target.value));
</script>
</body></html>
