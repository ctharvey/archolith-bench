<!-- portfolio.html — Portfolio summary -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio · Yawn</title><link rel="stylesheet" href="mobile.css"></head>
<body>
<div class="card" style="margin:8px;text-align:center;padding:16px">
  <div style="font-size:2rem;font-weight:700;color:var(--accent)" id="total">—</div>
  <div style="font-size:.8rem;color:var(--muted)">Collection Value</div>
</div>
<div id="portfolio-list">
  <a class="list-row" href="sets.html">
    <div class="row-thumb"></div>
    <div class="row-body"><div class="row-name">Scarlet &amp; Violet</div><div class="row-sub">124 cards</div></div>
    <div class="row-meta">$1,420</div>
  </a>
</div>
<nav class="bottom-nav">
  <a href="home.html">Pulse</a><a href="cards.html">Cards</a>
  <a href="sealed.html">Sealed</a><a href="sets.html">Sets</a><a href="decks.html">Decks</a><a href="series.html">Series</a><a class="active" href="portfolio.html">Portfolio</a><a href="trades.html">Trades</a><a href="vs.html">VS</a>
</nav>
<script type="module">
import { portfolio } from './api.js';
const totalEl = document.getElementById('total');
const list = document.getElementById('portfolio-list');
async function load(q){ const data = await portfolio({ q }); totalEl.textContent = '$' + data.total; list.innerHTML = data.sets.map(s =>
  `<a class="list-row" href="set-detail.html?id=${s.id}"><div class="row-thumb"></div>`+
  `<div class="row-body"><div class="row-name">${s.name}</div><div class="row-sub">${s.card_count} cards</div></div>`+
  `<div class="row-meta">$${s.subtotal}</div></a>`).join(''); }
document.querySelector('.search-input').addEventListener('input', e => load(e.target.value));
</script>
</body></html>
