<!-- search.html — Results browse/search -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search · Yawn</title><link rel="stylesheet" href="mobile.css"></head>
<body>
<div class="search-sticky"><input class="search-input" type="search" placeholder="Search all…"></div>
<div id="search-list">
  <a class="list-row" href="card-detail.html">
    <div class="row-thumb"></div>
    <div class="row-body"><div class="row-name">Charizard</div><div class="row-sub">Base Set · #4</div></div>
    <div class="row-meta">$420</div>
  </a>
</div>
<nav class="bottom-nav">
  <a href="home.html">Pulse</a><a href="cards.html">Cards</a>
  <a href="sealed.html">Sealed</a><a href="sets.html">Sets</a><a href="decks.html">Decks</a><a href="series.html">Series</a><a class="active" href="search.html">Search</a><a href="portfolio.html">Portfolio</a><a href="trades.html">Trades</a><a href="vs.html">VS</a>
</nav>
<script type="module">
import { searchAll } from './api.js';
const list = document.getElementById('search-list');
async function load(q){ const results = await searchAll({ q }); list.innerHTML = results.map(r =>
  `<a class="list-row" href="card-detail.html?id=${r.id}"><div class="row-thumb"></div>`+
  `<div class="row-body"><div class="row-name">${r.name}</div><div class="row-sub">${r.set}</div></div>`+
  `<div class="row-meta">$${r.price}</div></a>`).join(''); }
document.querySelector('.search-input').addEventListener('input', e => load(e.target.value));
</script>
</body></html>
