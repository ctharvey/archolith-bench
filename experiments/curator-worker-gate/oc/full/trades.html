<!-- trades.html — Trades browse/search -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trades · Yawn</title><link rel="stylesheet" href="mobile.css"></head>
<body>
<div class="search-sticky"><input class="search-input" type="search" placeholder="Search trades…"></div>
<div id="trade-list">
  <a class="list-row" href="trade-detail.html">
    <div class="row-thumb"></div>
    <div class="row-body"><div class="row-name">Charizard → Pikachu</div><div class="row-sub">−$380</div></div>
    <div class="row-meta">Jun 15</div>
  </a>
</div>
<nav class="bottom-nav">
  <a href="home.html">Pulse</a><a href="cards.html">Cards</a>
  <a href="sealed.html">Sealed</a><a href="sets.html">Sets</a><a href="decks.html">Decks</a><a href="series.html">Series</a><a class="active" href="trades.html">Trades</a><a href="vs.html">VS</a>
</nav>
<script type="module">
import { tradesList } from './api.js';
const list = document.getElementById('trade-list');
async function load(q){ const trades = await tradesList({ q }); list.innerHTML = trades.map(t =>
  `<a class="list-row" href="trade-detail.html?id=${t.id}"><div class="row-thumb"></div>`+
  `<div class="row-body"><div class="row-name">${t.give_card} → ${t.receive_card}</div><div class="row-sub">${t.value_diff}</div></div>`+
  `<div class="row-meta">${t.date}</div></a>`).join(''); }
document.querySelector('.search-input').addEventListener('input', e => load(e.target.value));
</script>
</body></html>
