<!-- watchlist.html — Watchlist browse/search -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watchlist · Yawn</title><link rel="stylesheet" href="mobile.css"></head>
<body>
<div class="search-sticky"><input class="search-input" type="search" placeholder="Search watchlist…"></div>
<div id="watch-list">
  <a class="list-row" href="card-detail.html">
    <div class="row-thumb"></div>
    <div class="row-body"><div class="row-name">Charizard</div><div class="row-sub">$420</div></div>
    <div class="row-meta" style="color:var(--accent)">+12</div>
  </a>
</div>
<nav class="bottom-nav">
  <a href="home.html">Pulse</a><a href="cards.html">Cards</a>
  <a href="sealed.html">Sealed</a><a href="sets.html">Sets</a><a href="decks.html">Decks</a><a href="series.html">Series</a><a class="active" href="watchlist.html">Watch</a><a href="trades.html">Trades</a><a href="vs.html">VS</a>
</nav>
<script type="module">
import { watchlist } from './api.js';
const list = document.getElementById('watch-list');
async function load(q){ const cards = await watchlist({ q }); list.innerHTML = cards.map(c =>
  `<a class="list-row" href="card-detail.html?id=${c.id}"><div class="row-thumb"></div>`+
  `<div class="row-body"><div class="row-name">${c.name}</div><div class="row-sub">$${c.price}</div></div>`+
  `<div class="row-meta" style="color:var(--accent)">${c.change > 0 ? '+' : ''}${c.change}</div></a>`).join(''); }
document.querySelector('.search-input').addEventListener('input', e => load(e.target.value));
</script>
</body></html>
