<!-- wishlist.html — Wishlist browse/search -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wishlist · Yawn</title><link rel="stylesheet" href="mobile.css"></head>
<body>
<div class="search-sticky"><input class="search-input" type="search" placeholder="Search wishlist…"></div>
<div id="wish-list">
  <a class="list-row" href="card-detail.html">
    <div class="row-thumb"></div>
    <div class="row-body"><div class="row-name">Charizard</div><div class="row-sub">Base Set · #4</div></div>
    <div class="row-meta" style="color:var(--accent)">$250</div>
  </a>
</div>
<nav class="bottom-nav">
  <a href="home.html">Pulse</a><a href="cards.html">Cards</a>
  <a href="sealed.html">Sealed</a><a href="sets.html">Sets</a><a href="decks.html">Decks</a><a href="series.html">Series</a><a href="stats.html">Stats</a><a class="active" href="wishlist.html">Wish</a><a href="portfolio.html">Portfolio</a><a href="trades.html">Trades</a><a href="vs.html">VS</a>
</nav>
<script type="module">
import { wishlist } from './api.js';
const list = document.getElementById('wish-list');
async function load(q){ const items = await wishlist({ q }); list.innerHTML = items.map(w =>
  `<a class="list-row" href="card-detail.html?id=${w.id}"><div class="row-thumb"></div>`+
  `<div class="row-body"><div class="row-name">${w.name}</div><div class="row-sub">${w.set}</div></div>`+
  `<div class="row-meta">$${w.target}</div></a>`).join(''); }
document.querySelector('.search-input').addEventListener('input', e => load(e.target.value));
</script>
</body></html>
