[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archolith-bench"
version = "0.4.0"
description = "Benchmark suite for the archolith token-reduction stack"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
authors = [{name = "Charles Harvey"}]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["benchmark", "llm", "token-reduction", "context-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "archolith-filter",
    "archolith-audit",
]

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/archolith/archolith-bench"
Issues = "https://github.com/archolith/archolith-bench/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["archolith_bench*"]

[project.scripts]
archolith-bench = "archolith_bench.cli:main"