[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archolith-bench"
version = "0.1.0"
description = "Unified benchmark suite for the archolith product family"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # TODO: add archolith-rtk and archolith-audit as editable deps for Phase 2+
    # "archolith-rtk",
    # "archolith-audit",
]

[project.scripts]
archolith-bench = "archolith_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["archolith_bench*"]